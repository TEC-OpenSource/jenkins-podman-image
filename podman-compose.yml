services:
  jenkins:
    # An imported, versioned local tag. There is deliberately no build section.
    image: ${JENKINS_IMAGE:-localhost/jenkins-25:2.580.2-4-amd64}
    pull_policy: never
    container_name: jenkins-25
    user: "jenkins:jenkins"
    # Rootless host user owns the bind directory, even when its UID is not 1000.
    userns_mode: "keep-id:uid=1000,gid=1000"
    restart: unless-stopped
    stop_grace_period: 120s
    env_file:
      - ./env.conf
    labels:
      io.tec-opensource.jenkins.healing: "true"
    ports:
      - "${JENKINS_HTTP_BIND:-0.0.0.0}:${JENKINS_HTTP_PORT:-8080}:8080"
    volumes:
      # Defaults are relative to this Compose file, not the calling shell's cwd.
      - "${JENKINS_HOME_DIR:-./jenkins_home}:/var/jenkins_home:Z"
      - "${JENKINS_PLUGINS_DIR:-./plugins}:/var/jenkins_home/plugins:Z"
      - "./scripts/healthcheck.sh:/usr/local/bin/jenkins-healthcheck.sh:ro,Z"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      JAVA_OPTS: ${JAVA_OPTS:--Xms1g -Xmx4g -Djava.awt.headless=true -Duser.timezone=Asia/Seoul}
      JENKINS_HEALTH_SCHEME: http
      JENKINS_HEALTH_PORT: "8080"
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/jenkins-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: ${JENKINS_HEALTH_START_PERIOD:-5m}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
