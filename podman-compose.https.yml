# Optional native Jenkins HTTPS. No reverse proxy or image rebuild is required.
# podman-compose -f podman-compose.yml -f podman-compose.https.yml up --no-build -d
services:
  jenkins:
    command: ["--config=/run/secrets/jenkins-https-config"]
    ports:
      - "${JENKINS_HTTPS_BIND:-0.0.0.0}:${JENKINS_HTTPS_PORT:-8443}:8443"
    volumes:
      - "${JENKINS_SSL_DIR:-./ssl}:/var/jenkins_ssl:ro,Z"
    secrets:
      - source: jenkins-https-config
        uid: "1000"
        gid: "1000"
        mode: "0400"
secrets:
  jenkins-https-config:
    external: true
